name: Update measles data

# Runs daily. The Johns Hopkins feed publishes Fridays end of day, so most runs
# find nothing and commit nothing — the point of running daily is that a
# breakage surfaces within a day instead of sitting unnoticed for a week.
# Upstream also revises past counts backwards, so figures can fall as well as rise.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-measles-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The script throws rather than writing zeroes if the feed is missing,
      # empty, or has changed shape, so a bad upstream day fails loudly here
      # instead of blanking the site's numbers.
      - name: Refresh figures from Johns Hopkins
        run: node scripts/update-measles-data.mjs

      - name: Commit if the figures changed
        id: commit
        run: |
          if git diff --quiet -- data/measles-stats.json index.html; then
            echo "No change in the published figures."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/measles-stats.json index.html
          SUMMARY=$(node -e "
            const d = require('./data/measles-stats.json');
            process.stdout.write(
              d.totalCases.toLocaleString('en-US') + ' cases, ' +
              d.reportingJurisdictions + ' jurisdictions, ' +
              d.epicenterState + ' epicenter (through ' + d.latestDataDate + ')'
            );
          ")
          git commit -m "Update measles figures: $SUMMARY" \
                     -m "Source: JHU Measles Tracking Team Data (CC BY 4.0)"
          git push || { git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GitHub disables scheduled workflows once a repository has gone 60 days
      # without activity — which is what silently killed the previous updater in
      # July 2026. If the data has genuinely not moved in a long while, push a
      # one-line marker so the schedule stays alive. Only fires after 45 days,
      # so it stays out of the way during normal operation.
      - name: Keep the schedule alive if the repo has gone quiet
        if: success() && steps.commit.outputs.changed == 'false'
        run: |
          DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $DAYS days ago."
          if [ "$DAYS" -lt 45 ]; then
            echo "Well inside the 60-day window; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-data-check
          git add .github/last-data-check
          git commit -m "Keep scheduled data job enabled (no change in $DAYS days)"
          git push || { git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; }

      # One tracking issue, reopened and commented on rather than duplicated.
      # The previous workflow opened a fresh issue every failure and left 21 open.
      - name: Report failure on the tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'Measles data update failing';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${TITLE}"`,
            });
            const existing = found.data.items.find((i) => i.title === TITLE);
            const body = [
              `The daily measles data refresh failed.`,
              ``,
              `- Run: ${run}`,
              `- Commit: \`${context.sha.slice(0, 7)}\``,
              ``,
              `The site keeps showing the last good figures until this is fixed —`,
              `\`data/measles-stats.json\` and the \`MEASLES_FALLBACK\` line in`,
              `\`index.html\` are only overwritten on a successful run.`,
              ``,
              `Most likely causes: the upstream CSV moved or changed columns`,
              `(see \`scripts/update-measles-data.mjs\`), or GitHub could not push.`,
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, state: 'open',
                });
              }
              core.notice(`Reported on existing issue #${existing.number}`);
            } else {
              const made = await github.rest.issues.create({
                ...context.repo, title: TITLE, body, labels: ['bug', 'automated'],
              });
              core.notice(`Opened issue #${made.data.number}`);
            }

      # Close the tracking issue once things are working again.
      - name: Resolve the tracking issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'Measles data update failing';
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${TITLE}"`,
            });
            for (const issue of found.data.items.filter((i) => i.title === TITLE)) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Recovered — the data refresh succeeded on \`${context.sha.slice(0, 7)}\`. Closing.`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed',
              });
              core.notice(`Closed issue #${issue.number}`);
            }
