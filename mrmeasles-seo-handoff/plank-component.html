<!--
  ============================================================
  PLATFORM PLANK MODAL PATTERN
  ============================================================
  Each plank is a clickable button on the homepage. Clicking opens a
  modal overlay containing the full essay. User scrolls within the
  modal; the page underneath stays still.

  ============================================================
  *** CRITICAL FOR SEO — READ THIS FIRST ***
  ============================================================

  The essay HTML MUST be present in the initial server-rendered page.
  Google indexes static HTML; it does NOT click buttons or run "open
  modal" interactions. If the essay text is fetched or mounted only
  AFTER the user clicks, Googlebot will never see it and the entire
  point of writing the essays is wasted.

  Three patterns to AVOID in React / Next.js:

    ❌  dynamic(() => import('./PlankDialog'), { ssr: false })
         — strips the dialog content from the server render entirely.

    ❌  {isOpen && <PlankDialog>{essay}</PlankDialog>}
         — children only mount when state flips to true. Initial HTML
         is missing the essay.

    ❌  Fetching essay text via fetch() / React Query / SWR inside
         the dialog component — content arrives client-side, after
         Googlebot has already moved on.

  The correct pattern: ALWAYS render the dialog and its essay
  children in the JSX tree. Control visibility with a ref-driven
  .showModal() / .close() call, NOT by conditionally rendering the
  children.

  ============================================================
  POST-DEPLOY VERIFICATION
  ============================================================

  Right-click → View Page Source on the homepage. Search for a
  unique phrase from one of the essays:

      "my fellow viral particles"

  All six essay phrases should appear in the page source even when
  no modal is visible. If you only find a placeholder like "Loading"
  or the dialog content is missing, the implementation is wrong.
  Fix it before launching.

  ============================================================
-->


<!-- ===========================================================
     A) Vanilla HTML / CSS / JS pattern (works everywhere)
     =========================================================== -->

<section class="plank-grid">

  <!-- Repeat one block per plank. Trigger button + dialog. -->
  <article class="plank">
    <button
      type="button"
      class="plank-trigger"
      aria-haspopup="dialog"
      aria-controls="plank-defund-the-cdc">
      <h3 class="plank-title">Defund the CDC</h3>
      <span class="plank-cta">Read the full plank →</span>
    </button>

    <dialog
      id="plank-defund-the-cdc"
      class="plank-dialog"
      aria-labelledby="plank-defund-the-cdc-title">
      <header class="plank-dialog-header">
        <h3 id="plank-defund-the-cdc-title">Defund the CDC</h3>
        <button type="button" class="plank-dialog-close" aria-label="Close">×</button>
      </header>
      <div class="plank-dialog-body">
        <!--
          Paste the FULL essay HTML here, server-rendered.
          Source: plank-defund-the-cdc.md (convert to HTML once at build
          time, or render with a markdown component — either is fine, as
          long as the HTML ends up in the page source).
        -->
        <p>My fellow viral particles, let me be direct with you...</p>
        <!-- ...rest of essay... -->
      </div>
    </dialog>
  </article>

</section>

<script>
  // Modal wiring. The essay text is ALREADY in the DOM at this point —
  // this script only toggles visibility, it does not load content.
  document.querySelectorAll('.plank-trigger').forEach(btn => {
    btn.addEventListener('click', () => {
      const dialog = document.getElementById(btn.getAttribute('aria-controls'));
      if (dialog && typeof dialog.showModal === 'function') {
        dialog.showModal();
      }
    });
  });

  document.querySelectorAll('.plank-dialog-close').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('dialog')?.close());
  });

  // Click on backdrop closes the dialog
  document.querySelectorAll('.plank-dialog').forEach(dialog => {
    dialog.addEventListener('click', (e) => {
      if (e.target === dialog) dialog.close();
    });
  });
</script>


<!-- ===========================================================
     B) React / Next.js pattern (likely what this site uses)
     ===========================================================
     Drop into a 'use client' component file. Pass the essay JSX
     as `children` — it ALWAYS renders, even when the dialog is
     closed. That's what keeps it indexable.
-->

<!--
'use client';
import { useRef } from 'react';

export function PlankCard({ id, title, children }) {
  const dialogRef = useRef(null);

  const open = () => dialogRef.current?.showModal();
  const close = () => dialogRef.current?.close();
  const onBackdropClick = (e) => {
    if (e.target === dialogRef.current) close();
  };

  return (
    <article className="plank">
      <button
        type="button"
        className="plank-trigger"
        onClick={open}
        aria-haspopup="dialog"
        aria-controls={`plank-${id}`}
      >
        <h3 className="plank-title">{title}</h3>
        <span className="plank-cta">Read the full plank →</span>
      </button>

      <dialog
        ref={dialogRef}
        id={`plank-${id}`}
        className="plank-dialog"
        aria-labelledby={`plank-${id}-title`}
        onClick={onBackdropClick}
      >
        <header className="plank-dialog-header">
          <h3 id={`plank-${id}-title`}>{title}</h3>
          <button type="button" onClick={close} aria-label="Close">×</button>
        </header>
        <div className="plank-dialog-body">
          {children}
        </div>
      </dialog>
    </article>
  );
}

// Usage in the homepage:
// <PlankCard id="defund-the-cdc" title="Defund the CDC">
//   <p>My fellow viral particles...</p>
//   <h4>What the CDC actually does to me</h4>
//   ...rest of the essay rendered as JSX...
// </PlankCard>
//
// CRITICAL: pass the essay as `children` directly, NOT inside a
// dynamic import, NOT behind a state guard. Children must be in
// the initial render so they ship in SSR HTML.
-->

      max-height: 100vh;
      height: 100vh;
      margin: 0;
      border-radius: 0;

    .plank-dialog-body {
      max-height: calc(100vh - 4.5rem);

</style>
